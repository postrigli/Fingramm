name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Чистый JVM-модуль: быстрый прогон без Android SDK.
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint, detekt, unit-тесты домена
        run: ./gradlew :domain:ktlintCheck :domain:detekt :domain:test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Линтеры (ktlint, detekt)
        run: ./gradlew ktlintCheck detekt
      - name: Unit-тесты (домен + репозитории на Room in-memory)
        run: ./gradlew test
      - name: Android Lint (release) и сборка release
        run: ./gradlew lintRelease assembleRelease
      - name: Сборка debug-APK (подписан отладочным ключом, устанавливается на телефон)
        run: ./gradlew assembleDebug
      - name: Схемы Room закоммичены
        # Сборка выгружает схему БД в app/schemas. Если версия схемы выросла, а новый файл не закоммичен,
        # MigrationTest не найдёт его. Тогда файл печатается сжатым в base64: python3 -c "import base64,gzip,sys;
        # sys.stdout.buffer.write(gzip.decompress(base64.b64decode(sys.stdin.read())))" < строка > файл.json
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::Схемы Room в app/schemas не закоммичены (или изменились). Закоммитьте их."
            git status --porcelain -- app/schemas
            for f in $(git status --porcelain -- app/schemas | awk '{print $2}'); do
              echo "=== $f"; sha256sum "$f"; gzip -9n -c "$f" | base64 -w0; echo
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Инструментальные тесты (UI онбординга, миграции Room) на эмуляторе.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
